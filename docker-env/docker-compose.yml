name: optional_field_save_migration_20

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    shm_size: '2gb'
    environment:
      # PGHOST/PGUSER/PGPASSWORD (libpq standar) — bukan lagi HOST/USER/PASSWORD ala entrypoint
      # image resmi odoo:X.0 (image itu tidak dipakai lagi, lihat Dockerfile). odoo-bin sendiri
      # tidak baca HOST/USER/PASSWORD apapun — psycopg2 yang baca PG* lewat libpq saat --db_host
      # dkk tidak eksplisit di command.
      PGHOST: db
      PGUSER: odoo
      PGPASSWORD: odoo
    ports:
      - "8091:8069"
    volumes:
      - ../optional_field_save:/mnt/extra-addons/optional_field_save
      - ./logs:/var/log/odoo
      # native-target (odoo20) — build dari source, bukan image pre-built (lihat Dockerfile/06c log).
      # Mount read-only: G1 cuma butuh MENJALANKAN core 20.0, tidak pernah menulisnya.
      - D:/Kuncoro/doodex/repo/odoo20:/opt/odoo:ro
    command: >
      -d optional_field_save_20_test
      -i optional_field_save,contacts
      --addons-path=/opt/odoo/addons,/opt/odoo/odoo/addons,/mnt/extra-addons
      --http-interface=0.0.0.0
      --test-enable
      --test-tags=/optional_field_save
      --stop-after-init
      --logfile=/var/log/odoo/odoo.log

volumes:
  db-data:
