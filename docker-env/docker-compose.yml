name: optional_field_save_migration_19

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    shm_size: '2gb'
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8091:8069"
    volumes:
      - ../optional_field_save:/mnt/extra-addons/optional_field_save
      - ./logs:/var/log/odoo
    command: >
      odoo -d optional_field_save_19_test
      -i optional_field_save,contacts
      --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
      --test-enable
      --test-tags=/optional_field_save
      --stop-after-init
      --logfile=/var/log/odoo/odoo.log

volumes:
  db-data:
