name: optional_field_save_backfill

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:17.0
    depends_on:
      - db
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8079:8069"
    volumes:
      - D:/Kuncoro/doodex/repo/optional-field-save-17/optional_field_save:/mnt/extra-addons/optional_field_save
      - ./logs:/var/log/odoo
    command: >
      odoo -d optional_field_save_test
      -i optional_field_save
      --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
      --test-enable
      --test-tags=/optional_field_save
      --stop-after-init
      --logfile=/var/log/odoo/odoo.log

volumes:
  db-data:
